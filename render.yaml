services:
  - type: web
    name: quickreach
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QUICKREACH_MODE
        value: demo
      - key: META_GRAPH_API_VERSION
        value: v24.0
      - key: APP_USERNAME
        value: quickreach-admin
      - key: APP_PASSWORD
        generateValue: true
